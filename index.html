<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Laith_LG | Profile</title>

<!-- FontAwesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<!-- 3D Skin Viewer Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/skinview3d@2.2.0/bundles/skinview3d.bundle.js"></script>

<style>
/* Local Monocraft Light Font Setup */
@font-face {
  font-family: 'Monocraft';
  src: url('./assets/fonts/weights/Monocraft-Light.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Monocraft', monospace;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  color: white;
  background: url("https://preview.redd.it/transfer-the-sky-and-clouds-from-one-shader-to-another-v0-tjlctiza59fc1.jpg?width=1080&crop=smart&auto=webp&s=58988636b13e96be95be67ea278f96be4b06f52e") center/cover no-repeat;
}

/* Background Overlay */
body::before {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(circle, rgba(15, 10, 25, 0.5) 0%, rgba(5, 5, 10, 0.85) 100%);
  backdrop-filter: blur(5px);
}

/* Red & Purple Background Glow */
.bg-glow {
  position: absolute;
  width: 500px;
  height: 500px;
  background: radial-gradient(circle, rgba(255, 0, 0, 0.2), rgba(170, 0, 170, 0.25) 50%, transparent 70%);
  filter: blur(80px);
  z-index: 0;
}

/* Main Profile Panel */
.card {
  width: 400px;
  background: rgba(18, 18, 24, 0.75);
  border: 2px solid rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(25px);
  border-radius: 16px;
  padding: 32px 24px;
  text-align: center;
  box-shadow: 0 0 30px rgba(0, 0, 0, 0.9), inset 0 0 15px rgba(255, 255, 255, 0.03);
  position: relative;
  z-index: 1;
  transition: all 0.3s ease;
}

.card:hover {
  transform: translateY(-5px);
  border-color: rgba(255, 0, 0, 0.3);
  box-shadow: 0 0 40px rgba(255, 0, 0, 0.25), 0 20px 50px rgba(0, 0, 0, 0.9);
}

/* 3D Skin Display Slot */
.avatar-skin {
  width: 150px;
  height: 150px;
  border-radius: 20px;
  margin: 0 auto;
  overflow: hidden;
  background: rgba(0, 0, 0, 0.6);
  border: 2px solid rgba(255, 255, 255, 0.15);
  box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.8), 0 8px 20px rgba(0, 0, 0, 0.5);
  display: flex;
  justify-content: center;
  align-items: center;
  cursor: grab;
}

.avatar-skin:active {
  cursor: grabbing;
}

.name {
  margin-top: 20px;
  font-size: 24px;
  color: #FFFFFF;
  text-shadow: 2px 2px 0px #000, 0 0 10px rgba(255, 255, 255, 0.3);
}

.handle {
  margin-top: 6px;
  font-size: 11px;
  color: #55FF55;
  letter-spacing: 0.5px;
  text-shadow: 1px 1px 0px #000;
}

/* YOUTUBE RED BUTTON */
.socials {
  margin-top: 24px;
}

.yt-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  width: 100%;
  padding: 13px;
  border-radius: 10px;
  background: linear-gradient(135deg, #FF0000, #CC0000);
  border: 1px solid #FF4444;
  color: #FFFFFF;
  text-decoration: none;
  font-size: 13px;
  text-shadow: 1px 1px 0px #000;
  box-shadow: 0 4px 15px rgba(255, 0, 0, 0.3);
  transition: all 0.25s ease;
}

.yt-btn:hover {
  transform: translateY(-2px) scale(1.02);
  background: linear-gradient(135deg, #FF2222, #DD0000);
  box-shadow: 0 0 25px rgba(255, 0, 0, 0.6);
}

.yt-btn i {
  font-size: 18px;
}

/* MINECRAFT STYLE SERVER IP BOX */
.server-box {
  margin-top: 16px;
  padding: 12px;
  border-radius: 8px;
  background: #000000;
  border: 2px solid #55FF55;
  box-shadow: inset 0 0 8px rgba(85, 255, 85, 0.3);
  font-size: 11px;
  color: #55FF55;
  word-break: break-all;
  user-select: all;
  text-shadow: 1px 1px 0px #000;
  position: relative;
}

.server-label {
  font-size: 9px;
  color: #AAAAAA;
  display: block;
  margin-bottom: 4px;
  text-transform: uppercase;
}
</style>
</head>

<body>

<div class="bg-glow"></div>

<div class="card">

  <!-- 3D SKIN VIEWER -->
  <div class="avatar-skin">
    <canvas id="skin_container"></canvas>
  </div>

  <!-- NAME & SUBTITLE -->
  <div class="name">Laith_LG</div>
  <div class="handle">MINECRAFT PLAYER AND CREATOR</div>

  <!-- RED YOUTUBE BUTTON -->
  <div class="socials">
    <a href="https://youtube.com/@YOUR_YOUTUBE_LINK" target="_blank" class="yt-btn">
      <i class="fa-brands fa-youtube"></i>
      YouTube
    </a>
  </div>

  <!-- MINECRAFT STYLE SERVER IP -->
  <div class="server-box">
    <span class="server-label">Server Address</span>
    IP: comingsoon.com
  </div>

</div>

<script>
  // Render Interactive 3D Skin
  let skinViewer = new skinview3d.SkinViewer({
      canvas: document.getElementById("skin_container"),
      width: 150,
      height: 150,
      skin: "https://mineskin.eu/skin/Steve"
  });

  skinViewer.fov = 70;
  skinViewer.zoom = 0.75;

  skinViewer.animation = new skinview3d.WalkingAnimation();
  skinViewer.animation.speed = 0.6;

  let controls = skinview3d.createOrbitControls(skinViewer);
  controls.enableZoom = false;
</script>

</body>
</html>

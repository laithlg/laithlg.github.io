<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Laith_LG | Profile</title>

<!-- FontAwesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<!-- 3D Skin Viewer Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/skinview3d@2.2.0/bundles/skinview3d.bundle.js"></script>

<style>
/* Local Monocraft Light Font Setup */
@font-face {
  font-family: 'Monocraft';
  src: url('./assets/fonts/weights/Monocraft-Light.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Monocraft', monospace;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  color: white;

  /* 🌄 BACKGROUND IMAGE: Change 'bg.png' or 'bg.jpg' to your image path */
  background: url("bg.png") center/cover no-repeat;
  background-color: #0b0b10; /* Fallback color */
}

/* Smooth Dark Overlay for Readability */
body::before {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at center, rgba(10, 10, 16, 0.45) 0%, rgba(5, 5, 8, 0.85) 100%);
  backdrop-filter: blur(8px);
}

/* Subtle Ambient Glow behind the Card */
.bg-glow {
  position: absolute;
  width: 480px;
  height: 480px;
  background: radial-gradient(circle, rgba(170, 0, 170, 0.15) 0%, rgba(255, 34, 34, 0.12) 50%, transparent 75%);
  filter: blur(90px);
  z-index: 0;
  pointer-events: none;
}

/* Main Profile Panel */
.card {
  width: 390px;
  background: rgba(16, 16, 22, 0.65);
  border: 1px solid rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(20px);
  border-radius: 20px;
  padding: 32px 24px;
  text-align: center;
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7),
              inset 0 1px 0 0 rgba(255, 255, 255, 0.1);
  position: relative;
  z-index: 1;
  transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s ease, border-color 0.3s ease;
}

.card:hover {
  transform: translateY(-4px);
  border-color: rgba(255, 255, 255, 0.18);
  box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.85),
              0 0 30px rgba(170, 0, 170, 0.15);
}

/* 3D Skin Display Frame */
.avatar-skin {
  width: 140px;
  height: 140px;
  border-radius: 50%;
  margin: 0 auto;
  overflow: hidden;
  background: rgba(8, 8, 12, 0.7);
  border: 2px solid rgba(255, 255, 255, 0.12);
  box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.8), 0 8px 24px rgba(0, 0, 0, 0.4);
  display: flex;
  justify-content: center;
  align-items: center;
  cursor: grab;
}

.avatar-skin:active {
  cursor: grabbing;
}

/* User Info */
.name {
  margin-top: 18px;
  font-size: 22px;
  color: #FFFFFF;
  letter-spacing: -0.5px;
  text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
}

.handle {
  margin-top: 6px;
  font-size: 10px;
  color: #55FF55;
  letter-spacing: 0.5px;
  opacity: 0.9;
  text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
}

/* YouTube Red Button */
.socials {
  margin-top: 22px;
}

.yt-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  background: linear-gradient(180deg, #E62117 0%, #BA120B 100%);
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: #FFFFFF;
  text-decoration: none;
  font-size: 12px;
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
  box-shadow: 0 4px 14px rgba(230, 33, 23, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.2);
  transition: all 0.2s ease;
}

.yt-btn:hover {
  transform: translateY(-2px);
  background: linear-gradient(180deg, #FF281B 0%, #CC140C 100%);
  box-shadow: 0 6px 20px rgba(230, 33, 23, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.3);
}

.yt-btn i {
  font-size: 16px;
}

/* Authentic Minecraft Style Server Box */
.mc-server-box {
  margin-top: 16px;
  padding: 12px 14px;
  background-color: #000000;
  border: 2px solid #000000;
  box-shadow: 
    inset -2px -2px 0px 0px #3c3c3c,
    inset 2px 2px 0px 0px #141414,
    0 4px 10px rgba(0, 0, 0, 0.5);
  border-radius: 4px;
  text-align: center;
  user-select: all;
  position: relative;
}

.mc-server-title {
  font-size: 9px;
  color: #AAAAAA;
  display: block;
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.mc-server-ip {
  font-size: 11px;
  color: #55FF55;
  text-shadow: 1px 1px 0px #003300;
  word-break: break-all;
}
</style>
</head>

<body>

<div class="bg-glow"></div>

<div class="card">

  <!-- 3D SKIN VIEWER -->
  <div class="avatar-skin">
    <canvas id="skin_container"></canvas>
  </div>

  <!-- NAME & SUBTITLE -->
  <div class="name">Laith_LG</div>
  <div class="handle">MINECRAFT PLAYER AND CREATOR</div>

  <!-- RED YOUTUBE BUTTON -->
  <div class="socials">
    <a href="https://youtube.com/@YOUR_YOUTUBE_LINK" target="_blank" class="yt-btn">
      <i class="fa-brands fa-youtube"></i>
      YouTube Channel
    </a>
  </div>

  <!-- AUTHENTIC MINECRAFT SERVER IP BOX -->
  <div class="mc-server-box">
    <span class="mc-server-title">Server Address</span>
    <span class="mc-server-ip">comingsoon.com</span>
  </div>

</div>

<script>
  // Render Interactive 3D Skin
  let skinViewer = new skinview3d.SkinViewer({
      canvas: document.getElementById("skin_container"),
      width: 140,
      height: 140,
      skin: "https://mineskin.eu/skin/Steve"
  });

  skinViewer.fov = 70;
  skinViewer.zoom = 0.75;

  skinViewer.animation = new skinview3d.WalkingAnimation();
  skinViewer.animation.speed = 0.6;

  let controls = skinview3d.createOrbitControls(skinViewer);
  controls.enableZoom = false;
</script>

</body>
</html>
